<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 牛头王 - 房间管理 | Nimmt! Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #1a1a2e; color: #eee; min-height: 100vh;
  }
  h1 { text-align: center; font-size: 1.6rem; margin: 16px 0 4px;
    background: linear-gradient(135deg, #4cc9f0, #4361ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .subtitle { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 16px; }

  .container { max-width: 800px; margin: 0 auto; padding: 12px; }

  /* Stats bar */
  .stats-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card {
    background: #16213e; border: 1px solid #0f3460; border-radius: 10px;
    padding: 12px 16px; flex: 1; min-width: 120px; text-align: center;
  }
  .stat-num { font-size: 1.6rem; font-weight: bold; color: #4cc9f0; }
  .stat-label { font-size: 0.75rem; color: #aaa; margin-top: 2px; }

  /* Actions */
  .actions { display: flex; gap: 10px; margin-bottom: 16px; justify-content: center; flex-wrap: wrap; }
  .btn {
    padding: 8px 20px; border: none; border-radius: 8px;
    font-size: 0.9rem; font-weight: bold; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.85; transform: scale(1.02); }
  .btn-primary { background: linear-gradient(135deg, #4cc9f0, #4361ee); color: #fff; }
  .btn-danger { background: linear-gradient(135deg, #f3722c, #c0392b); color: #fff; }
  .btn-gray { background: #2a2a4a; color: #aaa; border: 1px solid #444; }

  /* Room list */
  .room-list { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; overflow: hidden; }
  .room-header-row {
    display: grid; grid-template-columns: 120px 80px 70px 70px 70px 80px 1fr;
    padding: 10px 14px; background: #0f3460; font-size: 0.78rem; color: #aaa;
    font-weight: bold; gap: 8px; align-items: center;
  }
  .room-row {
    display: grid; grid-template-columns: 120px 80px 70px 70px 70px 80px 1fr;
    padding: 10px 14px; border-top: 1px solid #0f3460; font-size: 0.85rem;
    align-items: center; gap: 8px; transition: background 0.15s;
  }
  .room-row:hover { background: #1e1e3e; }
  .rid { font-family: monospace; color: #4cc9f0; font-size: 0.82rem; letter-spacing: 1px; }
  .phase-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: bold; display: inline-block; }
  .phase-waiting { background: #2a2a0e; color: #f9c74f; }
  .phase-playing { background: #0e2a1e; color: #2ecc71; }
  .phase-finished { background: #2a1a1e; color: #e74c3c; }
  .age { color: #888; font-size: 0.78rem; }
  .empty-msg { text-align: center; color: #555; padding: 30px; font-size: 0.9rem; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>

<div class="container">
  <h1>🔧 牛头王 · 房间管理</h1>
  <p class="subtitle">Nimmt! Multiplayer Room Admin</p>

  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="totalRooms">-</div><div class="stat-label">活跃房间</div></div>
    <div class="stat-card"><div class="stat-num" id="totalPlayers">-</div><div class="stat-label">在线玩家</div></div>
    <div class="stat-card"><div class="stat-num" id="playingCount">-</div><div class="stat-label">对战中</div></div>
    <div class="stat-card"><div class="stat-num" id="waitingCount">-</div><div class="stat-label">等待中</div></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="loadRooms()">🔄 刷新列表</button>
    <button class="btn btn-danger" onclick="cleanupRooms()">🗑️ 清理过期房间</button>
    <span style="color:#555;font-size:0.78rem;line-height:36px;">自动刷新倒计时: <span id="countdown">10</span>s</span>
  </div>

  <div class="room-list" id="roomList">
    <div class="room-header-row">
      <span>房间号</span><span>状态</span><span>配置</span><span>实际</span><span>AI</span><span>房主</span><span>创建时间</span>
    </div>
    <div id="roomRows"></div>
  </div>
</div>

<script>
const API_BASE = "/nimmt_api/nimmt_multi.php";
let timer = null;

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  return d.getMonth()+1+'/'+d.getDate()+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
}

function fmtAge(sec) {
  if (sec < 60) return sec + '秒前';
  if (sec < 3600) return Math.floor(sec/60) + '分钟前';
  return Math.floor(sec/3600) + '小时前';
}

async function loadRooms() {
  try {
    const res = await fetch(API_BASE + "?action=admin_list&_" + Date.now());
    const data = await res.json();

    document.getElementById('totalRooms').textContent = data.total || 0;

    let totalP = 0, playingN = 0, waitingN = 0;
    const el = document.getElementById('roomRows');

    if (!data.rooms || data.rooms.length === 0) {
      el.innerHTML = '<div class="empty-msg">暂无活跃房间</div>';
      document.getElementById('totalPlayers').textContent = '0';
      document.getElementById('playingCount').textContent = '0';
      document.getElementById('waitingCount').textContent = '0';
      return;
    }

    el.innerHTML = data.rooms.map(function(r) {
      totalP += r.actual_humans;
      if (r.phase === 'playing') playingN++;
      else if (r.phase === 'waiting') waitingN++;

      const phaseCls = r.phase === 'playing' ? 'phase-playing' : r.phase === 'finished' ? 'phase-finished' : 'phase-waiting';
      const phaseLabel = r.phase === 'playing' ? '🎮 对战' : r.phase === 'finished' ? '🏁 已结束' : '⏳ 等待';
      const configStr = (r.num_humans||'?') + '人+' + (r.num_ai||'?') + 'AI';

      return '<div class="room-row">' +
        '<span class="rid">' + r.room_id + '</span>' +
        '<span><span class="phase-badge ' + phaseCls + '">' + phaseLabel + '</span></span>' +
        '<span>' + configStr + '</span>' +
        '<span>' + r.actual_humans + '</span>' +
        '<span>' + r.actual_ai + '</span>' +
        '<span>' + (r.host_name || '-') + '</span>' +
        '<span class="age">' + fmtAge(r.age_sec) + '</span></div>';
    }).join('');

    document.getElementById('totalPlayers').textContent = totalP;
    document.getElementById('playingCount').textContent = playingN;
    document.getElementById('waitingCount').textContent = waitingN;
  } catch(e) {
    console.error('[Admin] load error:', e);
    document.getElementById('roomRows').innerHTML = '<div class="empty-msg">加载失败: ' + e.message + '</div>';
  }
}

async function cleanupRooms() {
  if (!confirm('确定要清理所有过期（超过30分钟无活动）的房间吗？')) return;
  try {
    const res = await fetch(API_BASE, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ action: "admin_cleanup" })
    });
    const data = await res.json();
    alert('清理完成！删除了 ' + (data.removed || 0) + ' 个过期房间');
    loadRooms();
  } catch(e) {
    alert('清理失败: ' + e.message);
  }
}

// Auto-refresh every 10 seconds
let countdown = 10;
function tick() {
  countdown--;
  const el = document.getElementById('countdown');
  if (el) el.textContent = countdown;
  if (countdown <= 0) {
    countdown = 10;
    loadRooms();
  }
}
setInterval(tick, 1000);

// Initial load
loadRooms();
</script>
</body>
</html>
